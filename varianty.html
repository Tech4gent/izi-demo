<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>IZI - выбор варианта сайта</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      background: #060608;
      color: #f4f5f7;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 24px;
      text-align: center;
    }
    img { width: 120px; }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(244,245,247,0.6); }
    .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      padding: 20px 38px;
      border-radius: 14px;
    }
    .a1 { background: #ffe600; color: #000; }
    .a2 { border: 2px solid rgba(244,245,247,0.4); color: #f4f5f7; }
    a:hover { filter: brightness(1.1); }
    p { font-size: 13px; color: rgba(244,245,247,0.45); max-width: 46ch; line-height: 1.6; }
  </style>
</head>
<body>
  <img src="assets/img/logo-white.png" alt="IZI">
  <h1>Два варианта сайта</h1>
  <div class="btns">
    <a class="a1" href="./">ВАРИАНТ 1 · ФОТО</a>
    <a class="a2" href="3d/">ВАРИАНТ 2 · 3D-СЦЕНА</a>
  </div>
  <p>Вариант 1 - на живых фотографиях клубов. Вариант 2 - с кинематографичной 3D-сценой (логотип, неоновый тоннель, плазменное ядро). Внизу каждой страницы есть кнопка переключения.</p>
</body>
</html>
